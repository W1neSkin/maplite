name = "maplite"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../apps/client/dist"
run_worker_first = ["/api/*", "/health/*"]

[[durable_objects.bindings]]
name = "MAPLITE"
class_name = "MapliteServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MapliteServer"]
